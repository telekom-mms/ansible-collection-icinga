---
name: CI - Linting & Testing

on:
  push:
    branches: [main]
    paths:
      - 'playbooks/**'
      - 'roles/**'
      - 'tests/**'
      - 'meta/**'
      - 'galaxy.yml'
      - '.github/workflows/CI.yml'
  pull_request:
    branches: [main]
    paths:
      - 'playbooks/**'
      - 'roles/**'
      - 'tests/**'
      - 'meta/**'
      - 'galaxy.yml'
      - '.github/workflows/CI.yml'
  # Run CI once per week (at 06:00 UTC)
  # This ensures that even if there haven't been commits that we are still
  # testing against latest version of ansible-test for each ansible-core
  # version
  schedule:
    - cron: "0 6 * * 1"

concurrency:
  group: >-
    ${{ github.workflow }}-${{
      github.event.pull_request.number || github.sha
    }}
  cancel-in-progress: true

jobs:
  ansible-sanity-tests:
    name: Sanity (Ⓐ${{ matrix.ansible }})
    strategy:
      matrix:
        ansible:
          - stable-2.17
          - stable-2.18
          - stable-2.19
          - devel
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: ansible_collections/telekom_mms/ansible_collection_icinga

      - name: Set up Python for Ansible ${{ matrix.ansible }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.ansible == 'devel' && '3.13' || '3.12' }}

      - name: Install ansible-base (${{ matrix.ansible }})
        run: python -m pip install https://github.com/ansible/ansible/archive/${{ matrix.ansible }}.tar.gz --disable-pip-version-check

      - name: Run sanity tests
        run: ansible-test sanity --docker -v --color
        working-directory: ./ansible_collections/telekom_mms/ansible_collection_icinga

  integration:
    runs-on: ubuntu-26.04
    name: I (Ⓐ${{ matrix.ansible }}+py${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        ansible:
          - stable-2.17
          - stable-2.18
          - stable-2.19
          - devel
        python:
          - "3.11"
          - "3.12"
        exclude:
          - ansible: devel
            python: "3.11"
          - ansible: devel
            python: "3.12"
        include:
          - ansible: devel
            python: "3.13"
    services:
      icinga:
        image: ghcr.io/telekom-mms/icinga2:director-1.8.1@sha256:bf9205d41607f1641146e870644af0529338d06a9b360737bdf56a3f951cc28b
        ports:
          - 80:80
    steps:
      - name: >-
          Perform integration testing against
          Ansible version ${{ matrix.ansible }}
          under Python ${{ matrix.python }}
        uses: ansible-community/ansible-test-gh-action@6ded727edb598e670ac056a8e680ca4050bac0a3 # v1.18.0
        with:
          ansible-core-version: ${{ matrix.ansible }}
          # OPTIONAL command to run before invoking `ansible-test integration`
          pre-test-cmd: sed -i "s/127.0.0.1/icinga/g" tests/integration/integration_config.yml
          target-python-version: ${{ matrix.python }}
          testing-type: integration
          test-deps: telekom_mms.icinga_director

  call-linting:
    name: Ansible Lint
    uses: telekom-mms/.github/.github/workflows/ansible-lint.yml@bc5e4db6c657f9993231c8a06d0f256d485e016a # main

  molecule:
    name: Molecule
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: ansible_collections/telekom_mms/ansible_collection_icinga

      - name: Set up Python 3.14
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: 3.14

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt
        working-directory: ansible_collections/telekom_mms/ansible_collection_icinga

      - name: Test role icinga_agent with molecule
        run: molecule test
        working-directory: ansible_collections/telekom_mms/ansible_collection_icinga/roles/icinga_agent
        env:
          PY_COLORS: "1"
          ANSIBLE_FORCE_COLOR: "1"

      - name: Test role icinga_plugins with molecule
        run: molecule test
        working-directory: ansible_collections/telekom_mms/ansible_collection_icinga/roles/icinga_plugins
        env:
          PY_COLORS: "1"
          ANSIBLE_FORCE_COLOR: "1"
