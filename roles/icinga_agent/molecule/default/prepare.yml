---
- name: Prepare
  hosts: all
  tasks:
    - name: Install epel repo
      when: ansible_facts.os_family == 'RedHat'
      ansible.builtin.yum:
        name: epel-release
        state: installed

    - name: Import icinga2 key
      when: ansible_facts.os_family == 'RedHat'
      ansible.builtin.rpm_key:
        state: present
        key: https://packages.icinga.com/icinga.key

    - name: Install icinga2 repo
      when: ansible_facts.os_family == 'RedHat'
      ansible.builtin.get_url:
        url: https://packages.icinga.com/centos/ICINGA-release.repo
        dest: /etc/yum.repos.d/ICINGA-release.repo
        mode: '0644'

    - name: Install icinga2 basic packages
      when: ansible_facts.os_family == 'Debian'
      ansible.builtin.apt:
        name:
          - gnupg
          - python3-debian
        state: present
        update_cache: true

    - name: Add icinga2 repo key on debian
      when: ansible_facts.distribution == "Debian"
      ansible.builtin.apt:
        deb: >-
          https://packages.icinga.com/icinga-archive-keyring_latest+{{ ansible_facts.distribution | lower }}{{ ansible_facts.distribution_major_version }}.deb

    - name: Add icinga2 repo key on ubuntu
      when: ansible_facts.distribution == "Ubuntu"
      ansible.builtin.apt:
        deb: "https://packages.icinga.com/icinga-archive-keyring_latest+{{ ansible_facts.distribution | lower }}{{ ansible_facts.distribution_version }}.deb"

    - name: Add icinga2 repository on debian
      when: ansible_facts.distribution == "Debian"
      ansible.builtin.deb822_repository:
        name: icinga-debian
        types:
          - deb
          - deb-src
        uris: https://packages.icinga.com/debian
        suites: icinga-{{ ansible_facts.distribution_release }}
        components: main
        signed_by: /usr/share/keyrings/icinga-archive-keyring.gpg
        state: present

    - name: Add icinga2 repository on ubuntu
      when: ansible_facts.distribution == "Ubuntu"
      ansible.builtin.deb822_repository:
        name: icinga-ubuntu
        types:
          - deb
          - deb-src
        uris: https://packages.icinga.com/ubuntu
        suites: icinga-{{ ansible_facts.lsb.codename }}
        components: main
        signed_by: /usr/share/keyrings/icinga-archive-keyring.gpg
        state: present

    - name: Install icinga2 build dependencies
      when: ansible_facts.os_family == 'Debian'
      ansible.builtin.apt:
        pkg: icinga2
        state: build-dep
        update_cache: true

    - name: Install icinga2 basic packages
      when: ansible_facts.os_family == 'Debian'
      ansible.builtin.apt:
        name: icinga2
        state: present
        update_cache: true
