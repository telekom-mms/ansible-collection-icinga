---
- name: Delete icinga downtimes (host and service) from defined author
  ansible.builtin.uri:
    url: "{{ icinga_downtime_icinga_api_uri }}:{{ icinga_downtime_icinga_api_port }}/v1/actions/remove-downtime?type=Downtime"
    url_username: "{{ icinga_downtime_icinga_api_user }}"
    url_password: "{{ icinga_downtime_icinga_api_password }}"
    validate_certs: true
    method: POST
    status_code: 200
    return_content: true
    headers:
      Accept: application/json
    body_format: json
    body: '{ "filter": "host.name==\"{{ item }}\" && downtime.author==\"{{ icinga_downtime_author }}\"", "pretty": true }'
  delegate_to: localhost
  loop:
    - "{{ icinga_downtime_host_filter }}"
